apiVersion: v1
kind: Service
metadata:
  name: todo-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app: todo-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      {{- if eq .Values.frontend.service.type "NodePort" }}
      nodePort: {{ .Values.frontend.service.nodePort | default 32422 }}
      {{- end }}